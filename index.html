<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🚨 ALERTE SYSTÈME 🚨</title>
    <style>
        body { background-color: #000; color: #ff0000; font-family: "Courier New", monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #glitch-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.1); display: none; pointer-events: none; }
        .loading-bar { width: 300px; border: 2px solid #ff0000; height: 20px; position: relative; }
        .progress { background: #ff0000; width: 0%; height: 100%; }
        .hidden { display: none; }
        #console { text-align: left; width: 80%; font-size: 14px; color: #00ff00; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 10% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, -2px); } }
    </style>
</head>
<body onclick="launchScare()">

    <div id="start">
        <h1 style="color: white;">Vérification de sécurité Roblox...</h1>
        <button style="padding: 15px; cursor: pointer;">CLIQUER POUR ANALYSER</button>
    </div>

    <div id="prank" class="hidden">
        <h1 id="msg">ANALYSE EN COURS...</h1>
        <div class="loading-bar"><div id="bar" class="progress"></div></div>
        <div id="console"></div>
    </div>

    <div id="glitch-overlay"></div>

    <script>
        function launchScare() {
            document.getElementById('start').classList.add('hidden');
            document.getElementById('prank').classList.remove('hidden');
            
            // Son d'erreur (optionnel si tu as un fichier son)
            // let audio = new Audio('https://www.myinstants.com/media/sounds/windows-xp-error.mp3');
            
            let bar = document.getElementById('bar');
            let consoleDiv = document.getElementById('console');
            let msg = document.getElementById('msg');
            let p = 0;

            let logs = [
                "> Accès au noyau système...",
                "> Suppression de C:/Users/Admin/Documents...",
                "> Désactivation du Pare-feu Windows...",
                "> ATTENTION : Température CPU critique (98°C)",
                "> Envoi de l'historique de navigation au serveur...",
                "> ÉCHEC DE LA RÉCUPÉRATION DU SYSTÈME"
            ];

            let i = 0;
            let interval = setInterval(() => {
                p += 2;
                bar.style.width = p + "%";

                if (p % 10 === 0 && i < logs.length) {
                    consoleDiv.innerHTML += logs[i] + "<br>";
                    i++;
                    // audio.play();
                }

                if (p >= 100) {
                    clearInterval(interval);
                    triggerFinal();
                }
            }, 100);
        }

        function triggerFinal() {
            document.body.style.animation = "shake 0.1s infinite";
            document.getElementById('glitch-overlay').style.display = 'block';
            document.getElementById('msg').innerText = "FATAL ERROR : DISQUE DUR CORROMPU";
            
            setInterval(() => {
                document.body.style.backgroundColor = (document.body.style.backgroundColor === 'black') ? 'red' : 'black';
            }, 50);

            setTimeout(() => {
                alert("⚠️ ALERTE DE SÉCURITÉ ⚠️\n\nTon ordinateur a été pris en otage.\nRedémarrer ne servira à rien.\n\n(C'est une blague ! Tu t'es encore fait avoir ! 😂)");
            }, 2000);
        }
    </script>
</body>
</html>
