<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🚨 SYSTÈME VERROUILLÉ 🚨</title>
    <style>
        body { background-color: #000; color: #ff0000; font-family: 'Arial Black', sans-serif; text-align: center; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #ransom-box { border: 5px solid #ff0000; padding: 20px; background: rgba(50, 0, 0, 0.9); box-shadow: 0 0 50px #ff0000; max-width: 80%; }
        h1 { font-size: 3rem; margin: 0; }
        .strawberry { font-size: 5rem; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
        .glitch { animation: shake 0.1s infinite; }
        .btn-pay { background: #ff0000; color: white; padding: 20px; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startVirus()" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:999; cursor:pointer; background: rgba(0,0,0,0.1);">
        <h2 style="color:white; margin-top:20%;">[ CLIQUEZ POUR RÉCUPÉRER VOS ROBUX ]</h2>
    </div>

    <div id="content" class="hidden" style="display:none;">
        <div id="ransom-box" class="glitch">
            <h1>SÉCURITÉ CORROMPUE</h1>
            <p class="strawberry">🍓</p>
            <p>Tous vos fichiers ont été chiffrés par le protocole <strong>STRAWBERRY_RED</strong>.</p>

            </div>
            <button class="btn-pay" onclick="alert('ERREUR : Solde de fraises insuffisant !')">PAYER EN FRAISES 🍓</button>
        </div>
    </div>

    <script>
        // Utilisation d'un son d'alarme système strident
        const alarm = new Audio('https://www.myinstants.com/media/sounds/nuke-alarm.mp3');
        alarm.loop = true;

        function startVirus() {
            // Demande le plein écran
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }

            // Cache l'overlay et montre le virus
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            // Lance le son à fond
            alarm.volume = 1.0;
            alarm.play();

            // Fait vibrer le téléphone
            if (navigator.vibrate) { navigator.vibrate([500, 200, 500, 200, 500]); }

            // Change le titre de l'onglet pour faire peur
            setInterval(() => {
                document.title = document.title === "🚨 SYSTÈME VERROUILLÉ 🚨" ? "🍓 DONNE UNE FRAISE 🍓" : "🚨 SYSTÈME VERROUILLÉ 🚨";
            }, 500);
