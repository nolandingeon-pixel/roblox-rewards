<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Admin Panel - Accès Restreint</title>
    <style>
        body { background-color: black; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .btn { padding: 20px 40px; background: #00ff00; color: black; font-weight: bold; border: none; cursor: pointer; border-radius: 5px; font-size: 1.2rem; }
        .danger { color: #ff0000; font-size: 2rem; font-weight: bold; display: none; }
        .loading { width: 80%; border: 1px solid #00ff00; height: 20px; margin-top: 20px; display: none; }
        .bar { background: #00ff00; height: 100%; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>⚠️ MISE À JOUR ROBLOX 2026 ⚠️</h2>
        <p>Cliquez pour synchroniser vos données et recevoir 10 000 Robux.</p>
        <button class="btn" onclick="startPrank()">SYNCHRONISER</button>
    </div>

    <div id="status">SYSTÈME PRÊT...</div>
    <div class="loading" id="loadBox"><div class="bar" id="bar"></div></div>
    <p id="finalMsg" class="danger">ERREUR CRITIQUE : VIRUS DÉTECTÉ</p>

    <script>
        function startPrank() {
            // Demande le plein écran
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }

            // Cache le bouton de départ
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('loadBox').style.display = 'block';
            
            let bar = document.getElementById('bar');
            let status = document.getElementById('status');
            let progress = 0;

            // Fait vibrer le téléphone (Android)
            if (navigator.vibrate) { navigator.vibrate([200, 100, 200, 100, 500]); }

            let interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                bar.style.width = progress + "%";
                
                if(progress < 30) status.innerText = "Accès aux fichiers système...";
                else if(progress < 60) status.innerText = "Extraction des mots de passe Discord...";
                else if(progress < 90) status.innerText = "Envoi des données vers le serveur distant...";
                else if(progress >= 100) {
                    clearInterval(interval);
                    status.style.display = 'none';
                    document.getElementById('loadBox').style.display = 'none';
                    document.getElementById('finalMsg').style.display = 'block';
                    document.body.style.backgroundColor = 'darkred';
                    
                    // Alerte finale qui boucle
                    setTimeout(() => {
                        alert("SYSTÈME PIRATÉ PAR GEMINI-AI 😈\n\nTes données sont à moi maintenant !");
                    }, 500);
                }
            }, 150);
        }
    </script>
</body>
</html>
